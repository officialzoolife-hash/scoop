<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lip Gloss Collection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fff9fb; color: #4a4049; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { display: flex; align-items: center; margin-bottom: 20px; position: relative; }
        .back-btn { background-color: #4a4049; color: #ffffff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; }
        .header h1 { position: absolute; left: 50%; transform: translateX(-50%); font-size: 18px; color: #4a4049; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card { background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 3px 10px rgba(224, 187, 228, 0.2); border: 1px solid #f5e6ed; display: flex; flex-direction: column; justify-content: space-between; }
        .card-img { width: 100%; height: 160px; background-color: #fcf8fa; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 10px; }
        .title { font-size: 13px; font-weight: 600; color: #4a4049; margin-bottom: 5px; }
        .price { font-size: 14px; font-weight: 700; color: #e67e22; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index1.html" class="back-btn">&#8592; Back</a>
            <h1>Lip Gloss</h1>
        </div>
        <div class="grid">
            <div class="card"><div class="card-img"><img src="download.jpeg" alt="Gloss 1"></div><div class="card-info"><div class="title">Glossy Pink</div><div class="price">Rs 350.00</div></div></div>
            <div class="card"><div class="card-img"><img src="download.jpeg" alt="Gloss 2"></div><div class="card-info"><div class="title">Shimmer Nude</div><div class="price">Rs 350.00</div></div></div>
            <div class="card"><div class="card-img"><img src="download.jpeg" alt="Gloss 3"></div><div class="card-info"><div class="title">Berry Blast</div><div class="price">Rs 350.00</div></div></div>
            <div class="card"><div class="card-img"><img src="download.jpeg" alt="Gloss 4"></div><div class="card-info"><div class="title">Clear Shine</div><div class="price">Rs 350.00</div></div></div>
            <div class="card"><div class="card-img"><img src="download.jpeg" alt="Gloss 5"></div><div class="card-info"><div class="title">Rose Petal</div><div class="price">Rs 350.00</div></div></div>
        </div>
    </div>
</body>
</html>
